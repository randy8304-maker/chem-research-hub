<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">兩種 CdS 催化位點設計對照</title><desc id="desc">左側為硫配位的孤立鎳單原子 CdS，用於 PLA 衍生乳酸光重整為丙酮酸與氫氣；右側為硫空缺 CdS，以空缺位點協助乳酸吸附並形成丙胺酸。兩者是不同研究中的材料系統。</desc><rect width="900" height="330" rx="24" fill="#edf0f4"/><text x="40" y="42" fill="#2c3e50" font-family="sans-serif" font-size="23" font-weight="700">CdS 催化位點工程｜兩篇研究、兩種反應目的</text><rect x="35" y="68" width="405" height="220" rx="20" fill="#fff" stroke="#d9e0e3" stroke-width="2"/><rect x="460" y="68" width="405" height="220" rx="20" fill="#fff" stroke="#d9e0e3" stroke-width="2"/><text x="64" y="108" fill="#405c4d" font-family="sans-serif" font-size="19" font-weight="700">Ni 單原子 / CdS</text><text x="490" y="108" fill="#405c4d" font-family="sans-serif" font-size="19" font-weight="700">硫空缺 CdS</text><g stroke="#93a7b4" stroke-width="3"><path d="M85 158h180m-180 48h180m-150-70v92m60-92v92m60-92v92"/><path d="M510 158h180m-180 48h180m-150-70v92m60-92v92m60-92v92"/></g><g fill="#5c768d"><circle cx="85" cy="158" r="12"/><circle cx="145" cy="158" r="12"/><circle cx="205" cy="158" r="12"/><circle cx="265" cy="158" r="12"/><circle cx="85" cy="206" r="12"/><circle cx="145" cy="206" r="12"/><circle cx="205" cy="206" r="12"/><circle cx="265" cy="206" r="12"/><circle cx="510" cy="158" r="12"/><circle cx="570" cy="158" r="12"/><circle cx="630" cy="158" r="12"/><circle cx="690" cy="158" r="12"/><circle cx="510" cy="206" r="12"/><circle cx="570" cy="206" r="12"/><circle cx="690" cy="206" r="12"/></g><circle cx="175" cy="182" r="16" fill="#bd8065" stroke="#fff" stroke-width="4"/><text x="166" y="188" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">Ni</text><circle cx="630" cy="206" r="14" fill="#fff" stroke="#bd8065" stroke-width="4" stroke-dasharray="5 4"/><text x="294" y="174" fill="#65717a" font-family="sans-serif" font-size="15">孤立位點</text><text x="717" y="204" fill="#65717a" font-family="sans-serif" font-size="15">S 空缺</text><text x="64" y="260" fill="#65717a" font-family="sans-serif" font-size="15">乳酸 → 丙酮酸 + H₂</text><text x="490" y="253" fill="#65717a" font-family="sans-serif" font-size="14">解聚中間體 → 丙酮酸 / 亞胺 → 丙胺酸</text><text x="40" y="316" fill="#8b6d59" font-family="sans-serif" font-size="14">概念對照：材料設計與反應產物各自對應原論文，圖中晶格為簡化示意，非原子結構解析圖。</text></svg>

