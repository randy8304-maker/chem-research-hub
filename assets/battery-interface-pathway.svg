<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">鋰離子電池界面與傳輸示意圖</title><desc id="desc">正極、電解液、SEI 膜與負極的分層示意，分別標示鋰離子路徑與外部電子路徑。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5c768d"/></marker><marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#bd8065"/></marker></defs><rect width="1000" height="430" rx="28" fill="#f5f2eb"/><text x="50" y="54" fill="#2c3e50" font-family="sans-serif" font-size="22" font-weight="700">電池內部：離子穿越界面　｜　外部電路：電子完成迴路</text><rect x="70" y="100" width="210" height="230" rx="18" fill="#dce7e0"/><rect x="280" y="100" width="390" height="230" fill="#fff"/><rect x="670" y="100" width="260" height="230" rx="18" fill="#dce6ed"/><text x="135" y="135" fill="#486454" font-family="sans-serif" font-size="20" font-weight="700">正極材料</text><text x="397" y="135" fill="#536873" font-family="sans-serif" font-size="20" font-weight="700">電解液 / 隔膜</text><text x="748" y="135" fill="#526d81" font-family="sans-serif" font-size="20" font-weight="700">負極材料</text><rect x="641" y="100" width="29" height="230" fill="#e7c8a2"/><text x="612" y="363" fill="#8b694c" font-family="sans-serif" font-size="17">SEI 膜</text><g fill="#6f8a79"><circle cx="138" cy="194" r="13"/><circle cx="202" cy="236" r="13"/><circle cx="123" cy="286" r="13"/></g><g fill="#5c768d"><circle cx="360" cy="205" r="12"/><circle cx="481" cy="260" r="12"/><circle cx="579" cy="194" r="12"/><circle cx="747" cy="232" r="13"/><circle cx="835" cy="190" r="13"/></g><path d="M205 176H790" fill="none" stroke="#5c768d" stroke-width="5" stroke-dasharray="10 9" marker-end="url(#arrow)"/><text x="432" y="174" fill="#526d81" font-family="sans-serif" font-size="17">Li⁺ 脫嵌 / 嵌入（方向隨充放電改變）</text><path d="M825 78V62H170V78" fill="none" stroke="#bd8065" stroke-width="4" marker-end="url(#arrow2)"/><text x="415" y="88" fill="#a46f59" font-family="sans-serif" font-size="17">電子 e⁻ 經外部電路流動</text><text x="75" y="397" fill="#52636b" font-family="sans-serif" font-size="16">理想 SEI：阻電子、通 Li⁺、抑制電解液持續還原；過厚或破裂會增加阻抗與鋰損失。</text></svg>

