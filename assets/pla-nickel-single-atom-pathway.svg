<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">Ni 單原子 CdS 將 PLA 衍生乳酸轉成丙酮酸與氫氣</title><desc id="desc">PLA 先以 150 度熱水預水解成乳酸，再由可見光激發的 Ni/CdS 催化乳酸脫氫，生成丙酮酸與氫氣。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#758e7f"/></marker><linearGradient id="sun" x2="1"><stop stop-color="#f4d895"/><stop offset="1" stop-color="#faedce"/></linearGradient></defs><rect width="1000" height="440" rx="28" fill="#f5f2eb"/><text x="45" y="50" fill="#2c3e50" font-family="sans-serif" font-size="22" font-weight="700">兩段式流程：熱水解聚供應底物，光催化選擇性脫氫</text><rect x="42" y="112" width="210" height="196" rx="20" fill="#fff" stroke="#dedbd1" stroke-width="2"/><text x="94" y="157" fill="#2c3e50" font-family="sans-serif" font-size="23" font-weight="700">廢 PLA</text><path d="M82 200c25-30 46 30 71 0s45 30 70 0" fill="none" stroke="#bb826b" stroke-width="8" stroke-linecap="round"/><text x="77" y="266" fill="#65717a" font-family="sans-serif" font-size="16">聚合物鏈</text><path d="M260 210H329" stroke="#758e7f" stroke-width="4" marker-end="url(#arrow)"/><rect x="340" y="112" width="238" height="196" rx="20" fill="#fff" stroke="#dedbd1" stroke-width="2"/><text x="377" y="158" fill="#3d5c4d" font-family="sans-serif" font-size="20" font-weight="700">熱水預水解</text><text x="377" y="198" fill="#65717a" font-family="sans-serif" font-size="17">150°C · 10 h</text><text x="377" y="233" fill="#65717a" font-family="sans-serif" font-size="16">PLA → 乳酸（LA）</text><text x="377" y="276" fill="#9a7653" font-family="sans-serif" font-size="15">無鹼 ≠ 無需供熱</text><path d="M585 210H650" stroke="#758e7f" stroke-width="4" marker-end="url(#arrow)"/><rect x="662" y="96" width="296" height="228" rx="24" fill="url(#sun)" stroke="#e4d4b4" stroke-width="2"/><text x="704" y="137" fill="#3d5c4d" font-family="sans-serif" font-size="20" font-weight="700">可見光照射 Ni/CdS</text><path d="M700 226h213" stroke="#829a8b" stroke-width="8" stroke-linecap="round"/><circle cx="740" cy="226" r="16" fill="#d5aa72"/><circle cx="793" cy="226" r="16" fill="#819bad"/><circle cx="846" cy="226" r="16" fill="#819bad"/><circle cx="899" cy="226" r="16" fill="#819bad"/><circle cx="793" cy="186" r="11" fill="#b96f57" stroke="#fff" stroke-width="4"/><text x="782" y="173" fill="#8b5846" font-family="sans-serif" font-size="14" font-weight="700">Ni₁</text><text x="710" y="275" fill="#52636b" font-family="sans-serif" font-size="15">Ni 位點接收電子；鄰近 S 協助乳酸吸附</text><path d="M813 337v35m0 0H680m133 0h140" stroke="#758e7f" stroke-width="3"/><rect x="642" y="377" width="180" height="42" rx="14" fill="#fff"/><rect x="824" y="377" width="150" height="42" rx="14" fill="#fff"/><text x="666" y="405" fill="#526d81" font-family="sans-serif" font-size="16" font-weight="700">丙酮酸</text><text x="864" y="405" fill="#526d81" font-family="sans-serif" font-size="16" font-weight="700">H₂</text></svg>

