<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">不同塑膠接入光催化重整的反應流程</title><desc id="desc">PET 經水解產生乙二醇，聚乙烯先氧化為含氧小分子；兩者進入半導體光催化反應，電洞氧化有機物，電子還原產氫。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#778f80"/></marker></defs><rect width="1000" height="440" rx="28" fill="#f2f4ef"/><text x="48" y="50" fill="#2c3e50" font-family="sans-serif" font-size="22" font-weight="700">聚合物結構決定前處理；載子利用決定光重整路徑</text><rect x="45" y="92" width="235" height="125" rx="18" fill="#fff" stroke="#dedbd1" stroke-width="2"/><text x="70" y="128" fill="#2c3e50" font-family="sans-serif" font-size="20" font-weight="700">PET（聚酯）</text><text x="70" y="160" fill="#65717a" font-family="sans-serif" font-size="16">酯鍵可水解</text><text x="70" y="190" fill="#5c768d" font-family="sans-serif" font-size="16">鹼解 → EG + 對苯二甲酸鹽</text><rect x="45" y="245" width="235" height="125" rx="18" fill="#fff" stroke="#dedbd1" stroke-width="2"/><text x="70" y="281" fill="#2c3e50" font-family="sans-serif" font-size="20" font-weight="700">PE（聚烯烴）</text><text x="70" y="313" fill="#65717a" font-family="sans-serif" font-size="16">C–C 主鏈惰性，難水解</text><text x="70" y="343" fill="#5c768d" font-family="sans-serif" font-size="16">先氧化 → 短鏈含氧物</text><path d="M294 153H390M294 307H390" stroke="#778f80" stroke-width="4" marker-end="url(#arr)"/><rect x="400" y="128" width="210" height="204" rx="24" fill="#e5eee8" stroke="#b9cabe" stroke-width="2"/><text x="435" y="168" fill="#3d5c4d" font-family="sans-serif" font-size="19" font-weight="700">半導體吸光</text><text x="443" y="209" fill="#526d81" font-family="sans-serif" font-size="17">價帶 e⁻ → 導帶</text><circle cx="473" cy="257" r="23" fill="#5c768d"/><text x="461" y="264" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">e⁻</text><circle cx="547" cy="257" r="23" fill="#c38e68"/><text x="535" y="264" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">h⁺</text><text x="428" y="307" fill="#65717a" font-family="sans-serif" font-size="15">到達表面前避免復合</text><path d="M620 211H700" stroke="#778f80" stroke-width="4" marker-end="url(#arr)"/><rect x="716" y="92" width="240" height="125" rx="18" fill="#fff" stroke="#dedbd1" stroke-width="2"/><text x="750" y="134" fill="#526d81" font-family="sans-serif" font-size="20" font-weight="700">還原端：e⁻</text><text x="750" y="177" fill="#65717a" font-family="sans-serif" font-size="18">質子 / 水 → H₂</text><rect x="716" y="245" width="240" height="125" rx="18" fill="#fff" stroke="#dedbd1" stroke-width="2"/><text x="750" y="287" fill="#a46f59" font-family="sans-serif" font-size="20" font-weight="700">氧化端：h⁺</text><text x="750" y="330" fill="#65717a" font-family="sans-serif" font-size="18">有機底物 → 化學品</text><text x="48" y="410" fill="#7b817e" font-family="sans-serif" font-size="15">示意流程不代表所有催化劑均可同時處理 PET 與 PE；需逐一驗證前處理、產物與碳平衡。</text></svg>

