<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">硫空缺 CdS 催化 PLA 轉化丙胺酸流程</title><desc id="desc">氨水使 PLA 同時氨解與水解產生乳酸銨及乳醯胺；可見光下 CdS 硫空缺促進乳酸吸附，乳酸經丙酮酸和亞胺中間體還原胺化生成丙胺酸。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#758e7f"/></marker></defs><rect width="1000" height="450" rx="28" fill="#f2f4ef"/><text x="42" y="49" fill="#2c3e50" font-family="sans-serif" font-size="22" font-weight="700">氨同時參與解聚與供氮；硫空缺需維持適中</text><rect x="42" y="112" width="183" height="208" rx="20" fill="#fff" stroke="#dedbd1" stroke-width="2"/><text x="90" y="158" fill="#2c3e50" font-family="sans-serif" font-size="22" font-weight="700">PLA 廢料</text><text x="73" y="205" fill="#65717a" font-family="sans-serif" font-size="16">NH₃ 水溶液</text><text x="73" y="238" fill="#65717a" font-family="sans-serif" font-size="16">熱促進氨解／水解</text><text x="73" y="281" fill="#a46f59" font-family="sans-serif" font-size="15">乳酸銨 + 乳醯胺</text><path d="M232 215H303" stroke="#758e7f" stroke-width="4" marker-end="url(#arr)"/><rect x="314" y="112" width="205" height="208" rx="20" fill="#e8eff2" stroke="#cddbe1" stroke-width="2"/><text x="357" y="158" fill="#3d5c4d" font-family="sans-serif" font-size="21" font-weight="700">適量 S 空缺</text><g stroke="#93a7b4" stroke-width="3"><path d="M361 201h106M361 243h106M381 180v84m42-84v84m42-84v84"/></g><g fill="#5c768d"><circle cx="361" cy="201" r="9"/><circle cx="403" cy="201" r="9"/><circle cx="445" cy="201" r="9"/><circle cx="467" cy="243" r="9"/><circle cx="382" cy="243" r="9"/></g><circle cx="424" cy="243" r="12" fill="#fff" stroke="#bd8065" stroke-width="4" stroke-dasharray="4 3"/><text x="348" y="291" fill="#65717a" font-family="sans-serif" font-size="14">吸附位點 ↑；過量阻礙傳輸</text><path d="M527 215H590" stroke="#758e7f" stroke-width="4" marker-end="url(#arr)"/><rect x="601" y="112" width="177" height="208" rx="20" fill="#fff3d8" stroke="#ead9b6" stroke-width="2"/><text x="640" y="158" fill="#7c6541" font-family="sans-serif" font-size="20" font-weight="700">可見光</text><text x="640" y="202" fill="#526d81" font-family="sans-serif" font-size="17">h⁺：氧化乳酸</text><text x="640" y="239" fill="#526d81" font-family="sans-serif" font-size="17">e⁻：還原亞胺</text><text x="640" y="282" fill="#65717a" font-family="sans-serif" font-size="15">CdS-3 活性最佳</text><path d="M786 215H843" stroke="#758e7f" stroke-width="4" marker-end="url(#arr)"/><rect x="855" y="112" width="112" height="208" rx="20" fill="#e7efea" stroke="#cbd9d0" stroke-width="2"/><text x="881" y="157" fill="#3d5c4d" font-family="sans-serif" font-size="19" font-weight="700">丙胺酸</text><text x="883" y="216" fill="#65717a" font-family="sans-serif" font-size="16">乳酸</text><text x="894" y="246" fill="#65717a" font-family="sans-serif" font-size="16">↓</text><text x="882" y="277" fill="#65717a" font-family="sans-serif" font-size="16">丙酮酸</text><text x="43" y="382" fill="#65717a" font-family="sans-serif" font-size="16">反應序列：乳酸 → 丙酮酸 → 亞胺中間體 → 丙胺酸</text><text x="43" y="414" fill="#8b6d59" font-family="sans-serif" font-size="15">副反應：光生電子可用於產氫；此研究的目標產物是丙胺酸。</text></svg>

